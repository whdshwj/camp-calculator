<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>露營區即時備料與採購計算機</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding-bottom: 50px; }
        header { background-color: #1e293b; border-bottom: 1px solid #334155; padding: 12px 16px; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .max-w { max-width: 800px; margin: 0 auto; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        h1 { font-size: 18px; color: #fbbf24; font-weight: bold; }
        h2 { font-size: 15px; color: #fbbf24; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .sub-card { background-color: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
        input[type="number"], select { width: 100%; background-color: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-size: 16px; font-weight: bold; text-align: center; color: #ffffff; outline: none; }
        input[type="number"]:focus, select:focus { border-color: #fbbf24; }
        select { text-align-last: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media(min-width: 640px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }
        .btn-danger { background-color: rgba(225, 29, 72, 0.8); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .badge-success { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-danger { background-color: rgba(244, 63, 94, 0.2); color: #fb7185; }
        .text-sm { font-size: 13px; }
        .text-xs { font-size: 11px; color: #94a3b8; }
        .font-bold { font-weight: bold; }
        .text-amber { color: #fbbf24; }
    </style>
</head>
<body>

    <header>
        <div class="max-w flex-between">
            <div>
                <h1>🏕️ 露營區智慧備料計算機</h1>
                <p class="text-xs">營區專用 · 自動記憶數據</p>
            </div>
            <button onclick="resetAll()" class="btn-danger">🗑️ 重置</button>
        </div>
    </header>

    <div class="container">

        <!-- 區塊一：輸入區 -->
        <div class="card">
            <h2>📥 營區入住與人數數據</h2>

            <div class="grid-2" style="margin-bottom: 12px;">
                <div class="sub-card" style="margin-bottom:0;">
                    <label style="color: #fcd34d;">早餐總人數 (昨天下午入住)</label>
                    <input type="number" id="yesterdayGuests" min="0" value="4" oninput="calculate()">
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <label style="color: #fcd34d;">下午入住總人數 (下午茶/晚餐)</label>
                    <input type="number" id="todayGuests" min="0" value="18" oninput="calculate()">
                </div>
            </div>

            <div class="sub-card">
                <label style="color: #fcd34d; margin-bottom:6px;">今天入住帳篷數 (上限20帳，用以核對酸菜魚分配)</label>
                <input type="number" id="todayTents" min="0" max="20" value="6" oninput="calculate()">
                <div id="tentWarning" class="text-xs" style="color: #fb7185; margin-top: 4px; display: none;">⚠️ 不可超過 20 帳！</div>
            </div>

            <div class="sub-card">
                <div class="flex-between" style="margin-bottom: 6px;">
                    <label style="margin-bottom:0;">酸菜魚口味分配 (須等於總帳篷數)</label>
                    <span id="flavorSumStatus" class="badge badge-success">分配正確</span>
                </div>
                <div class="grid-3">
                    <div>
                        <span class="text-xs" style="display:block; margin-bottom:4px;">辣湯盤數</span>
                        <input type="number" id="soupSpicy" min="0" value="2" oninput="calculate()">
                    </div>
                    <div>
                        <span class="text-xs" style="display:block; margin-bottom:4px;">酸湯盤數</span>
                        <input type="number" id="soupAcid" min="0" value="3" oninput="calculate()">
                    </div>
                    <div>
                        <span class="text-xs" style="display:block; margin-bottom:4px;">清湯盤數</span>
                        <input type="number" id="soupClear" min="0" value="1" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div class="grid-4">
                <div class="sub-card" style="margin-bottom:0;">
                    <label>五人菜盆</label>
                    <input type="number" id="basinFive" min="0" value="0" oninput="calculate()">
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <label>大菜盆 (3-4人)</label>
                    <input type="number" id="basinLarge" min="0" value="4" oninput="calculate()">
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <label>小菜盆 (2人)</label>
                    <input type="number" id="basinSmall" min="0" value="2" oninput="calculate()">
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <label>素菜盆 (額外)</label>
                    <input type="number" id="basinVegan" min="0" value="0" oninput="calculate()">
                </div>
            </div>

            <!-- 下拉選單：單份菜盆食材速查 -->
            <div class="sub-card" style="margin-top: 12px; margin-bottom:0; background-color: #1e293b;">
                <label style="color: #fcd34d; margin-bottom:6px;">📖 單份菜盆食材明細速查 (下拉檢視)</label>
                <select id="basinSelector" onchange="showBasinDetail()">
                    <option value="five">🟢 五人菜盆 (點此檢視單份明細)</option>
                    <option value="large">🟡 大菜盆 (3-4人) (點此檢視單份明細)</option>
                    <option value="small">🟠 小菜盆 (2人) (點此檢視單份明細)</option>
                    <option value="vegan">🟣 素菜盆 (額外) (點此檢視單份明細)</option>
                </select>
                <div id="basinDetailDisplay" class="text-xs" style="margin-top: 8px; line-height: 1.6; color: #94a3b8; background: #0f172a; padding: 8px; border-radius: 6px;"></div>
            </div>
        </div>

        <!-- 區塊：洗米計算機 -->
        <div class="card">
            <h2>🍚 洗米與煮飯水量計算 <span class="text-xs">(1杯=650g，水=杯數×950-100cc)</span></h2>
            <div class="grid-3">
                <div class="sub-card" style="margin-bottom:0;">
                    <label style="color: #fcd34d;">洗米杯數</label>
                    <input type="number" id="riceCups" min="0" step="0.5" value="2" oninput="calculate()">
                </div>
                <div class="sub-card" style="margin-bottom:0; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                    <span class="text-xs">生米總重</span>
                    <span id="riceWeightOut" class="text-amber font-bold" style="font-size:18px; margin-top:4px;">1300 g</span>
                </div>
                <div class="sub-card" style="margin-bottom:0; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                    <span class="text-xs">實際加水量</span>
                    <span id="riceWaterOut" class="text-amber font-bold" style="font-size:18px; margin-top:4px;">1800 cc</span>
                </div>
            </div>
        </div>

        <!-- 區塊二：結果輸出 -->
        <div class="card">
            <h2>🌅 早餐備料清單 <span class="text-xs" id="breakfastCount">(人數：4 人)</span></h2>
            <div id="breakfastList" class="grid-2"></div>
        </div>

        <div class="card">
            <h2>🍲 晚餐酸菜魚湯底備料 <span class="text-xs">(各湯底獨立計算，分開烹煮)</span></h2>
            <div id="soupList" class="grid-3"></div>
        </div>

        <div class="card">
            <h2>🥬 晚餐菜盆食材總計</h2>
            <div id="vegetableList" class="grid-4"></div>
        </div>

        <div class="card">
            <h2>🧃 下午茶與晚餐飲料備料 <span class="text-xs">(含糖漿/奶精粉配方)</span></h2>
            <div id="drinkList" class="grid-2"></div>
        </div>

    </div>

    <script>
        const STORAGE_KEY = 'camp_calculator_data_v1';

        const defaultValues = {
            yesterdayGuests: 4,
            todayGuests: 18,
            todayTents: 6,
            soupSpicy: 2,
            soupAcid: 3,
            soupClear: 1,
            basinFive: 0,
            basinLarge: 4,
            basinSmall: 2,
            basinVegan: 0,
            riceCups: 2,
            basinSelector: 'five'
        };

        const basinDetails = {
            five: "高麗菜: 150g | 青江菜: 80g | 香菇: 2朵 | 南瓜: 6片 | 牛蕃茄: 3片 | 金針菇(大): 1片 | 白蘿蔔: 5片",
            large: "高麗菜: 150g | 青江菜: 80g | 香菇: 2朵 | 南瓜: 5片 | 牛蕃茄: 2片 | 金針菇(大): 1片 | 白蘿蔔: 4片",
            small: "高麗菜: 100g | 青江菜: 40g | 香菇: 1朵 | 南瓜: 3片 | 牛蕃茄: 1片 | 金針菇(小): 1片 | 白蘿蔔: 2片",
            vegan: "高麗菜: 80g | 青江菜: 30g | 香菇: 1朵 | 南瓜: 3片 | 牛蕃茄: 1片 | 金針菇(小): 1片 | 白蘿蔔: 2片"
        };

        function showBasinDetail() {
            const selectEl = document.getElementById('basinSelector');
            const displayEl = document.getElementById('basinDetailDisplay');
            const val = selectEl.value;
            displayEl.innerHTML = `<span class="text-amber font-bold">單份明細：</span> ${basinDetails[val]}`;
            // 順便儲存下拉選單狀態
            const currentData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            currentData.basinSelector = val;
            saveData(currentData);
        }

        function loadSavedData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const data = JSON.parse(saved);
                    Object.keys(defaultValues).forEach(key => {
                        const el = document.getElementById(key);
                        if (el && data[key] !== undefined) {
                            el.value = data[key];
                        }
                    });
                }
            } catch (e) {
                console.error('讀取記憶失敗:', e);
            }
            showBasinDetail();
        }

        function saveData(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.error('儲存記憶失敗:', e);
            }
        }

        function getTieredDrinkCC(guests) {
            if (guests <= 0) return 0;
            if (guests < 15) return 2000;
            if (guests < 30) return 3000;
            if (guests < 50) return 3500;
            return 4000;
        }

        function getPreparedSoupPortions(ordered) {
            if (ordered <= 0) return 0;
            if (ordered === 1) return 3;
            if (ordered === 2) return 5;
            if (ordered === 5) return 10;
            if (ordered === 12) return 23;
            return Math.ceil(ordered * 1.8 + 1);
        }

        function calculate() {
            const currentData = {
                yesterdayGuests: parseInt(document.getElementById('yesterdayGuests').value) || 0,
                todayGuests: parseInt(document.getElementById('todayGuests').value) || 0,
                todayTents: parseInt(document.getElementById('todayTents').value) || 0,
                soupSpicy: parseInt(document.getElementById('soupSpicy').value) || 0,
                soupAcid: parseInt(document.getElementById('soupAcid').value) || 0,
                soupClear: parseInt(document.getElementById('soupClear').value) || 0,
                basinFive: parseInt(document.getElementById('basinFive').value) || 0,
                basinLarge: parseInt(document.getElementById('basinLarge').value) || 0,
                basinSmall: parseInt(document.getElementById('basinSmall').value) || 0,
                basinVegan: parseInt(document.getElementById('basinVegan').value) || 0,
                riceCups: parseFloat(document.getElementById('riceCups').value) || 0,
                basinSelector: document.getElementById('basinSelector').value
            };

            saveData(currentData);

            const {
                yesterdayGuests, todayGuests, todayTents,
                soupSpicy, soupAcid, soupClear,
                basinFive, basinLarge, basinSmall, basinVegan,
                riceCups
            } = currentData;

            const warningEl = document.getElementById('tentWarning');
            warningEl.style.display = todayTents > 20 ? 'block' : 'none';

            const totalSoupOrdered = soupSpicy + soupAcid + soupClear;
            const sumStatusEl = document.getElementById('flavorSumStatus');
            if (totalSoupOrdered === todayTents) {
                sumStatusEl.textContent = "分配正確";
                sumStatusEl.className = "badge badge-success";
            } else {
                sumStatusEl.textContent = `總和(${totalSoupOrdered})≠帳篷(${todayTents})`;
                sumStatusEl.className = "badge badge-danger";
            }

            // 0. 洗米計算
            const riceWeight = Math.round(riceCups * 650);
            const riceWater = riceCups > 0 ? Math.max(0, Math.round(riceCups * 950 - 100)) : 0;
            document.getElementById('riceWeightOut').textContent = `${riceWeight} g`;
            document.getElementById('riceWaterOut').textContent = `${riceWater} cc`;

            // 1. 早餐
            document.getElementById('breakfastCount').textContent = `(人數：${yesterdayGuests} 人)`;
            const eggPortions = Math.ceil(yesterdayGuests / 8);
            const eggLiquid = eggPortions * 500;
            const eggSalt = eggPortions * 2.5;

            let breakfastHtml = `
                <div class="sub-card" style="margin-bottom:0; display:flex; justify-content:space-between; align-items:center;">
                    <div><span class="font-bold">🥚 炒蛋蛋液</span><br><span class="text-xs">每 8 人 500cc</span></div>
                    <span class="text-amber font-bold" style="font-size:16px;">${eggLiquid} cc</span>
                </div>
                <div class="sub-card" style="margin-bottom:0; display:flex; justify-content:space-between; align-items:center;">
                    <div><span class="font-bold">🧂 早餐蛋液用鹽</span><br><span class="text-xs">總計添加量</span></div>
                    <span class="text-amber font-bold" style="font-size:16px;">${eggSalt} g</span>
                </div>
            `;

            if (yesterdayGuests < 8 && yesterdayGuests > 0) {
                const orangeWater = 2000;
                const orangeSyrup = (orangeWater / 1000) * 160;
                breakfastHtml += `
                    <div class="sub-card" style="margin-bottom:0;">
                        <div class="flex-between"><span class="font-bold">🍊 早餐柳橙汁</span><span class="text-amber font-bold">${orangeWater} cc</span></div>
                        <div class="text-xs" style="margin-top:4px;">水 ${orangeWater}g ＋ 糖漿 <span class="text-amber font-bold">${orangeSyrup}g</span></div>
                    </div>
                    <div class="sub-card" style="margin-bottom:0; opacity: 0.5;">
                        <div class="flex-between"><span class="font-bold">🫖 早餐紅茶</span><span class="font-bold">0 cc</span></div>
                        <div class="text-xs" style="margin-top:4px;">&lt;8人不出品</div>
                    </div>
                `;
            } else {
                const bfCC = getTieredDrinkCC(yesterdayGuests);
                const orangeSyrup = (bfCC / 1000) * 160;
                breakfastHtml += `
                    <div class="sub-card" style="margin-bottom:0;">
                        <div class="flex-between"><span class="font-bold">🍊 早餐柳橙汁</span><span class="text-amber font-bold">${bfCC} cc</span></div>
                        <div class="text-xs" style="margin-top:4px;">水 ${bfCC}g ＋ 糖漿 <span class="text-amber font-bold">${orangeSyrup}g</span></div>
                    </div>
                    <div class="sub-card" style="margin-bottom:0;">
                        <div class="flex-between"><span class="font-bold">🫖 早餐紅茶</span><span class="text-amber font-bold">${bfCC} cc</span></div>
                        <div class="text-xs" style="margin-top:4px;">直接由現成紅茶桶出餐</div>
                    </div>
                `;
            }
            document.getElementById('breakfastList').innerHTML = breakfastHtml;

            // 2. 酸菜魚
            const prepSpicy = getPreparedSoupPortions(soupSpicy);
            const prepAcid = getPreparedSoupPortions(soupAcid);
            const prepClear = getPreparedSoupPortions(soupClear);

            document.getElementById('soupList').innerHTML = `
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="text-amber font-bold" style="margin-bottom:4px;">🔥 辣湯 (點${soupSpicy}份)</div>
                    <div class="text-sm">需備湯：<span class="font-bold">${prepSpicy}份</span></div>
                    <div class="text-xs" style="margin-top:4px; line-height: 1.5;">
                        • 水：${prepSpicy * 1000}g<br>
                        • 醬油：${prepSpicy * 20}g<br>
                        • 火鍋底料：${prepSpicy} 塊<br>
                        • 鹽巴：<span class="text-amber font-bold">${prepSpicy * 7}g</span><br>
                        • 大骨粉：<span class="text-amber font-bold">${prepSpicy * 3}g</span>
                    </div>
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="text-amber font-bold" style="margin-bottom:4px;">🍋 酸湯 (點${soupAcid}份)</div>
                    <div class="text-sm">需備湯：<span class="font-bold">${prepAcid}份</span></div>
                    <div class="text-xs" style="margin-top:4px; line-height: 1.5;">
                        • 水：${prepAcid * 1000}g<br>
                        • 酸菜醬：${prepAcid * 40}g<br>
                        • 白醋：${prepAcid * 30}g<br>
                        • 米酒：${prepAcid * 15}g<br>
                        • 鹽巴：<span class="text-amber font-bold">${prepAcid * 7}g</span><br>
                        • 大骨粉：<span class="text-amber font-bold">${prepAcid * 3}g</span>
                    </div>
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="text-amber font-bold" style="margin-bottom:4px;">🥣 清湯 (點${soupClear}份)</div>
                    <div class="text-sm">需備湯：<span class="font-bold">${prepClear}份</span></div>
                    <div class="text-xs" style="margin-top:4px; line-height: 1.5;">
                        • 水：${prepClear * 1000}g<br>
                        • 基礎調味<br>
                        • 鹽巴：<span class="text-amber font-bold">${prepClear * 7}g</span><br>
                        • 大骨粉：<span class="text-amber font-bold">${prepClear * 5}g</span>
                    </div>
                </div>
            `;

            // 3. 菜盆總計
            const vegCabbage = (basinFive * 150) + (basinLarge * 150) + (basinSmall * 100) + (basinVegan * 80);
            const vegBokChoy = (basinFive * 80) + (basinLarge * 80) + (basinSmall * 40) + (basinVegan * 30);
            const vegMushroom = (basinFive * 2) + (basinLarge * 2) + (basinSmall * 1) + (basinVegan * 1);
            const vegPumpkin = (basinFive * 6) + (basinLarge * 5) + (basinSmall * 3) + (basinVegan * 3);
            const vegTomato = (basinFive * 3) + (basinLarge * 2) + (basinSmall * 1) + (basinVegan * 1);
            const vegEnokiLarge = (basinFive * 1) + (basinLarge * 1) + (basinSmall * 0) + (basinVegan * 0);
            const vegEnokiSmall = (basinFive * 0) + (basinLarge * 0) + (basinSmall * 1) + (basinVegan * 1);
            const vegRadish = (basinFive * 5) + (basinLarge * 4) + (basinSmall * 2) + (basinVegan * 2);

            document.getElementById('vegetableList').innerHTML = `
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">高麗菜</span><br><span class="font-bold" style="font-size:15px;">${vegCabbage} g</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">青江菜</span><br><span class="font-bold" style="font-size:15px;">${vegBokChoy} g</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">香菇</span><br><span class="font-bold" style="font-size:15px;">${vegMushroom} 朵</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">南瓜</span><br><span class="font-bold" style="font-size:15px;">${vegPumpkin} 片</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">牛蕃茄</span><br><span class="font-bold" style="font-size:15px;">${vegTomato} 片</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">金針菇(大)</span><br><span class="font-bold" style="font-size:15px;">${vegEnokiLarge} 片</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">金針菇(小)</span><br><span class="font-bold" style="font-size:15px;">${vegEnokiSmall} 片</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">白蘿蔔</span><br><span class="font-bold" style="font-size:15px;">${vegRadish} 片</span></div>
            `;

            // 4. 下午茶與晚餐飲料
            const afDrinkCC = getTieredDrinkCC(todayGuests);
            const milkPowder = (afDrinkCC / 1000) * 50;
            const grapefruitSyrup = (afDrinkCC / 1000) * 160;
            const kumquatSyrup = (afDrinkCC / 1000) * 150;

            document.getElementById('drinkList').innerHTML = `
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="flex-between"><span class="font-bold">🧋 下午茶奶茶</span><span class="text-amber font-bold">${afDrinkCC} cc</span></div>
                    <div class="text-xs" style="margin-top:4px;">紅茶 ${afDrinkCC}cc ＋ 奶精粉 <span class="text-amber font-bold">${milkPowder}g</span></div>
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="flex-between"><span class="font-bold">🍇 下午葡萄柚汁</span><span class="text-amber font-bold">${afDrinkCC} cc</span></div>
                    <div class="text-xs" style="margin-top:4px;">水 ${afDrinkCC}g ＋ 糖漿 <span class="text-amber font-bold">${grapefruitSyrup}g</span></div>
                </div>
                <div class="sub-card" style="margin-bottom:0; grid-column: 1 / -1;">
                    <div class="flex-between"><span class="font-bold">🍋 晚餐金桔檸檬</span><span class="text-amber font-bold">${afDrinkCC} cc</span></div>
                    <div class="text-xs" style="margin-top:4px;">水 ${afDrinkCC}g ＋ 檸檬濃縮汁 <span class="text-amber font-bold">${kumquatSyrup}g</span></div>
                </div>
            `;
        }

        function resetAll() {
            if (confirm("確定要清空記憶並重置為預設值嗎？")) {
                localStorage.removeItem(STORAGE_KEY);
                Object.keys(defaultValues).forEach(key => {
                    const el = document.getElementById(key);
                    if (el) el.value = defaultValues[key];
                });
                showBasinDetail();
                calculate();
            }
        }

        window.onload = function() {
            loadSavedData();
            calculate();
        };
    </script>
</body>
</html>
