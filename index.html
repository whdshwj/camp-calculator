<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>露營區即時備料與採購計算機</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #0f172a; color: #f8fafc; padding-bottom: 50px; }
        header { background-color: #1e293b; border-bottom: 1px solid #334155; padding: 12px 16px; position: sticky; top: 0; z-index: 50; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .max-w { max-width: 800px; margin: 0 auto; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: 0 auto; padding: 16px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
        h1 { font-size: 18px; color: #fbbf24; font-weight: bold; }
        h2 { font-size: 15px; color: #fbbf24; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
        .sub-card { background-color: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
        input[type="number"] { width: 100%; background-color: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 10px; font-size: 16px; font-weight: bold; text-align: center; color: #ffffff; outline: none; }
        input[type="number"]:focus { border-color: #fbbf24; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .grid-4 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        @media(min-width: 640px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }
        .btn-danger { background-color: rgba(225, 29, 72, 0.8); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .badge-success { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
        .badge-danger { background-color: rgba(244, 63, 94, 0.2); color: #fb7185; }
        .text-sm { font-size: 13px; }
        .text-xs { font-size: 11px; color: #94a3b8; }
        .font-bold { font-weight: bold; }
        .text-amber { color: #fbbf24; }
    </style>
</head>
<body>

    <header>
        <div class="max-w flex-between">
            <div>
                <h1>🏕️ 露營區智慧備料計算機</h1>
                <p class="text-xs">營區專用 · 即時換算</p>
            </div>
            <button onclick="resetAll()" class="btn-danger">🗑️ 重置</button>
        </div>
    </header>

    <div class="container">

        <!-- 區塊一：輸入區 -->
        <div class="card">
            <h2>📥 營區入住與人數數據</h2>

            <div class="grid-2" style="margin-bottom: 12px;">
                <div class="sub-card" style="margin-bottom:0;">
                    <label style="color: #fcd34d;">早餐總人數 (昨天下午入住)</label>
                    <input type="number" id="yesterdayGuests" min="0" value="4" oninput="calculate()">
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <label style="color: #fcd34d;">下午入住總人數 (下午茶/晚餐)</label>
                    <input type="number" id="todayGuests" min="0" value="18" oninput="calculate()">
                </div>
            </div>

            <div class="sub-card">
                <label style="color: #fcd34d; margin-bottom:6px;">今天入住帳篷數 (上限20帳，用以核對酸菜魚分配)</label>
                <input type="number" id="todayTents" min="0" max="20" value="6" oninput="calculate()">
                <div id="tentWarning" class="text-xs" style="color: #fb7185; margin-top: 4px; display: none;">⚠️ 不可超過 20 帳！</div>
            </div>

            <div class="sub-card">
                <div class="flex-between" style="margin-bottom: 6px;">
                    <label style="margin-bottom:0;">酸菜魚口味分配 (須等於總帳篷數)</label>
                    <span id="flavorSumStatus" class="badge badge-success">分配正確</span>
                </div>
                <div class="grid-3">
                    <div>
                        <span class="text-xs" style="display:block; margin-bottom:4px;">酸湯盤數</span>
                        <input type="number" id="soupAcid" min="0" value="3" oninput="calculate()">
                    </div>
                    <div>
                        <span class="text-xs" style="display:block; margin-bottom:4px;">辣湯盤數</span>
                        <input type="number" id="soupSpicy" min="0" value="2" oninput="calculate()">
                    </div>
                    <div>
                        <span class="text-xs" style="display:block; margin-bottom:4px;">清湯盤數</span>
                        <input type="number" id="soupClear" min="0" value="1" oninput="calculate()">
                    </div>
                </div>
            </div>

            <div class="grid-3">
                <div class="sub-card" style="margin-bottom:0;">
                    <label>大菜盆 (3+人)</label>
                    <input type="number" id="basinLarge" min="0" value="4" oninput="calculate()">
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <label>小菜盆 (2人)</label>
                    <input type="number" id="basinSmall" min="0" value="2" oninput="calculate()">
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <label>素菜盆 (額外)</label>
                    <input type="number" id="basinVegan" min="0" value="0" oninput="calculate()">
                </div>
            </div>
        </div>

        <!-- 區塊二：結果輸出 -->
        <div class="card">
            <h2>🌅 早餐備料清單 <span class="text-xs" id="breakfastCount">(人數：4 人)</span></h2>
            <div id="breakfastList" class="grid-2"></div>
        </div>

        <div class="card">
            <h2>🍲 晚餐酸菜魚湯底備料 <span class="text-xs">(含1.5倍鍋量 + 動態加湯)</span></h2>
            <div id="soupList" class="grid-3" style="margin-bottom: 12px;"></div>
            <div class="sub-card" style="margin-bottom: 0;">
                <label style="color:#fcd34d; margin-bottom:8px;">🧂 湯底共用辛香/調味料統整</label>
                <div id="commonSeasoning" class="grid-4 text-sm" style="text-align:center;"></div>
            </div>
        </div>

        <div class="card">
            <h2>🥬 晚餐菜盆食材總計</h2>
            <div id="vegetableList" class="grid-4"></div>
        </div>

        <div class="card">
            <h2>🧃 全天飲料備料清單 <span class="text-xs">(依實戰級距換算)</span></h2>
            <div id="drinkList" class="grid-2"></div>
        </div>

    </div>

    <script>
        // 級距式飲料水量對照函數 (依據人數決定單桶水量)
        function getTieredDrinkCC(guests) {
            if (guests <= 0) return 0;
            if (guests < 15) return 2000;
            if (guests < 30) return 3000;
            if (guests < 50) return 3500;
            return 4000;
        }

        function getPreparedSoupPortions(ordered) {
            if (ordered <= 0) return 0;
            if (ordered === 1) return 3;
            if (ordered === 2) return 5;
            if (ordered === 5) return 10;
            if (ordered === 12) return 23;
            return Math.ceil(ordered * 1.8 + 1);
        }

        function calculate() {
            const yesterdayGuests = parseInt(document.getElementById('yesterdayGuests').value) || 0;
            const todayGuests = parseInt(document.getElementById('todayGuests').value) || 0;
            const todayTents = parseInt(document.getElementById('todayTents').value) || 0;
            const soupAcid = parseInt(document.getElementById('soupAcid').value) || 0;
            const soupSpicy = parseInt(document.getElementById('soupSpicy').value) || 0;
            const soupClear = parseInt(document.getElementById('soupClear').value) || 0;
            const basinLarge = parseInt(document.getElementById('basinLarge').value) || 0;
            const basinSmall = parseInt(document.getElementById('basinSmall').value) || 0;
            const basinVegan = parseInt(document.getElementById('basinVegan').value) || 0;

            const warningEl = document.getElementById('tentWarning');
            warningEl.style.display = todayTents > 20 ? 'block' : 'none';

            const totalSoupOrdered = soupAcid + soupSpicy + soupClear;
            const sumStatusEl = document.getElementById('flavorSumStatus');
            if (totalSoupOrdered === todayTents) {
                sumStatusEl.textContent = "分配正確";
                sumStatusEl.className = "badge badge-success";
            } else {
                sumStatusEl.textContent = `總和(${totalSoupOrdered})≠帳篷(${todayTents})`;
                sumStatusEl.className = "badge badge-danger";
            }

            // 1. 早餐 (未達 8 人只出柳橙汁 2000cc，不出紅茶；8人以上雙飲品依級距)
            document.getElementById('breakfastCount').textContent = `(人數：${yesterdayGuests} 人)`;
            const eggPortions = Math.ceil(yesterdayGuests / 8);
            const eggLiquid = eggPortions * 500;
            const eggSalt = eggPortions * 2.5;

            let breakfastHtml = `
                <div class="sub-card" style="margin-bottom:0; display:flex; justify-content:space-between; align-items:center;">
                    <div><span class="font-bold">🥚 炒蛋蛋液</span><br><span class="text-xs">每 8 人 500cc</span></div>
                    <span class="text-amber font-bold" style="font-size:16px;">${eggLiquid} cc</span>
                </div>
                <div class="sub-card" style="margin-bottom:0; display:flex; justify-content:space-between; align-items:center;">
                    <div><span class="font-bold">🧂 早餐蛋液用鹽</span><br><span class="text-xs">總計添加量</span></div>
                    <span class="text-amber font-bold" style="font-size:16px;">${eggSalt} g</span>
                </div>
            `;

            if (yesterdayGuests < 8 && yesterdayGuests > 0) {
                breakfastHtml += `
                    <div class="sub-card" style="margin-bottom:0; display:flex; justify-content:space-between; align-items:center;">
                        <div><span class="font-bold">🍊 早餐柳橙汁</span><br><span class="text-xs">&lt;8人單出</span></div>
                        <span class="text-amber font-bold" style="font-size:16px;">2000 cc</span>
                    </div>
                    <div class="sub-card" style="margin-bottom:0; display:flex; justify-content:space-between; align-items:center; opacity: 0.5;">
                        <div><span class="font-bold">🫖 早餐紅茶</span><br><span class="text-xs">&lt;8人不出品</span></div>
                        <span class="text-slate-400 font-bold" style="font-size:16px;">0 cc</span>
                    </div>
                `;
            } else {
                const bfCC = getTieredDrinkCC(yesterdayGuests);
                breakfastHtml += `
                    <div class="sub-card" style="margin-bottom:0; display:flex; justify-content:space-between; align-items:center;">
                        <div><span class="font-bold">🍊 早餐柳橙汁</span><br><span class="text-xs">依級距換算</span></div>
                        <span class="text-amber font-bold" style="font-size:16px;">${bfCC} cc</span>
                    </div>
                    <div class="sub-card" style="margin-bottom:0; display:flex; justify-content:space-between; align-items:center;">
                        <div><span class="font-bold">🫖 早餐紅茶</span><br><span class="text-xs">依級距換算</span></div>
                        <span class="text-amber font-bold" style="font-size:16px;">${bfCC} cc</span>
                    </div>
                `;
            }
            document.getElementById('breakfastList').innerHTML = breakfastHtml;

            // 2. 酸菜魚
            const prepAcid = getPreparedSoupPortions(soupAcid);
            const prepSpicy = getPreparedSoupPortions(soupSpicy);
            const prepClear = getPreparedSoupPortions(soupClear);
            const totalSalt = (prepAcid * 7) + (prepSpicy * 7) + (prepClear * 7);
            const totalBonePowder = (prepAcid * 3) + (prepSpicy * 3) + (prepClear * 5);

            document.getElementById('soupList').innerHTML = `
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="text-amber font-bold" style="margin-bottom:4px;">酸湯 (點${soupAcid}份)</div>
                    <div class="text-sm">需備湯：<span class="font-bold">${prepAcid}份</span></div>
                    <div class="text-xs" style="margin-top:2px;">水:${prepAcid*1000}g|酸醬:${prepAcid*40}g|白醋:${prepAcid*30}g|米酒:${prepAcid*15}g</div>
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="text-amber font-bold" style="margin-bottom:4px;">辣湯 (點${soupSpicy}份)</div>
                    <div class="text-sm">需備湯：<span class="font-bold">${prepSpicy}份</span></div>
                    <div class="text-xs" style="margin-top:2px;">水:${prepSpicy*1000}g|醬油:${prepSpicy*20}g|底料:${prepSpicy}塊</div>
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="text-amber font-bold" style="margin-bottom:4px;">清湯 (點${soupClear}份)</div>
                    <div class="text-sm">需備湯：<span class="font-bold">${prepClear}份</span></div>
                    <div class="text-xs" style="margin-top:2px;">水:${prepClear*1000}g|基礎調味</div>
                </div>
            `;

            document.getElementById('commonSeasoning').innerHTML = `
                <div style="background:#1e293b; padding:8px; border-radius:6px;"><span class="text-xs">鹽巴總計</span><br><span class="text-amber font-bold">${totalSalt} g</span></div>
                <div style="background:#1e293b; padding:8px; border-radius:6px;"><span class="text-xs">大骨粉總計</span><br><span class="text-amber font-bold">${totalBonePowder} g</span></div>
                <div style="background:#1e293b; padding:8px; border-radius:6px;"><span class="text-xs">酸菜醬總計</span><br><span class="text-amber font-bold">${prepAcid * 40} g</span></div>
                <div style="background:#1e293b; padding:8px; border-radius:6px;"><span class="text-xs">火鍋底料</span><br><span class="text-amber font-bold">${prepSpicy} 塊</span></div>
            `;

            // 3. 菜盆
            const vegCabbage = (basinLarge * 150) + (basinSmall * 100) + (basinVegan * 80);
            const vegBokChoy = (basinLarge * 80) + (basinSmall * 40) + (basinVegan * 30);
            const vegMushroom = (basinLarge * 2) + (basinSmall * 1) + (basinVegan * 1);
            const vegPumpkin = (basinLarge * 5) + (basinSmall * 3) + (basinVegan * 3);
            const vegTomato = (basinLarge * 2) + (basinSmall * 1) + (basinVegan * 1);
            const vegEnokiLarge = (basinLarge * 1) + (basinSmall * 0) + (basinVegan * 0);
            const vegEnokiSmall = (basinLarge * 0) + (basinSmall * 1) + (basinVegan * 1);
            const vegRadish = (basinLarge * 4) + (basinSmall * 2) + (basinVegan * 2);

            document.getElementById('vegetableList').innerHTML = `
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">高麗菜</span><br><span class="font-bold" style="font-size:15px;">${vegCabbage} g</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">青江菜</span><br><span class="font-bold" style="font-size:15px;">${vegBokChoy} g</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">香菇</span><br><span class="font-bold" style="font-size:15px;">${vegMushroom} 朵</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">南瓜</span><br><span class="font-bold" style="font-size:15px;">${vegPumpkin} 片</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">牛蕃茄</span><br><span class="font-bold" style="font-size:15px;">${vegTomato} 片</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">金針菇(大)</span><br><span class="font-bold" style="font-size:15px;">${vegEnokiLarge} 片</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">金針菇(小)</span><br><span class="font-bold" style="font-size:15px;">${vegEnokiSmall} 片</span></div>
                <div class="sub-card" style="margin-bottom:0;"><span class="text-xs">白蘿蔔</span><br><span class="font-bold" style="font-size:15px;">${vegRadish} 片</span></div>
            `;

            // 4. 下午茶與晚餐飲料 (依級距換算)
            const afDrinkCC = getTieredDrinkCC(todayGuests);

            document.getElementById('drinkList').innerHTML = `
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="flex-between"><span class="font-bold">🧋 下午茶奶茶</span><span class="text-amber font-bold">${afDrinkCC} cc</span></div>
                    <div class="text-xs">依實戰級距換算</div>
                </div>
                <div class="sub-card" style="margin-bottom:0;">
                    <div class="flex-between"><span class="font-bold">🍇 下午葡萄柚汁</span><span class="text-amber font-bold">${afDrinkCC} cc</span></div>
                    <div class="text-xs">依實戰級距換算</div>
                </div>
                <div class="sub-card" style="margin-bottom:0; grid-column: 1 / -1;">
                    <div class="flex-between"><span class="font-bold">🍋 晚餐金桔檸檬</span><span class="text-amber font-bold">${afDrinkCC} cc</span></div>
                    <div class="text-xs">依實戰級距換算</div>
                </div>
            `;
        }

        function resetAll() {
            if (confirm("確定要重置嗎？")) {
                document.getElementById('yesterdayGuests').value = 4;
                document.getElementById('todayGuests').value = 18;
                document.getElementById('todayTents').value = 6;
                document.getElementById('soupAcid').value = 3;
                document.getElementById('soupSpicy').value = 2;
                document.getElementById('soupClear').value = 1;
                document.getElementById('basinLarge').value = 4;
                document.getElementById('basinSmall').value = 2;
                document.getElementById('basinVegan').value = 0;
                calculate();
            }
        }

        window.onload = calculate;
    </script>
</body>
</html>
